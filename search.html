<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>校园失物招领 · 搜索</title>
  <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
  <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>

<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-slate-300 font-sans antialiased">
  <div class="relative w-full h-full max-w-[393px] max-h-[852px] bg-slate-50 flex flex-col overflow-hidden shadow-2xl">
    <!-- 搜索头部 -->
    <header class="shrink-0 border-b border-slate-200 bg-white px-4 pb-3 pt-5">
      <div class="flex items-center gap-2">
        <a class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-500" href="index.html">
          <iconify-icon class="text-2xl" icon="mdi:chevron-left"></iconify-icon>
        </a>
        <div class="flex min-w-0 flex-1 items-center gap-2 rounded-xl bg-slate-100 px-3 py-2">
          <iconify-icon class="text-lg text-slate-400" icon="mdi:magnify"></iconify-icon>
          <input autocomplete="off" class="min-w-0 flex-1 bg-transparent text-[13px] text-slate-700 placeholder-slate-400 outline-none" id="searchInput" placeholder="物品名称、地点，如“水杯 教学楼”" type="text" />
          <button class="flex h-5 w-5 items-center justify-center rounded-full bg-slate-300 text-white" id="clearBtn" onclick="clearKeyword()" type="button">
            <iconify-icon class="text-sm" icon="mdi:close"></iconify-icon>
          </button>
        </div>
        <button class="shrink-0 text-[13px] font-medium text-blue-600" onclick="runSearch()" type="button">搜索</button>
      </div>
      <!-- 热门搜索 -->
      <div class="mt-3" id="hotBlock">
        <p class="text-[11px] text-slate-400">大家都在搜</p>
        <div class="mt-2 flex flex-wrap gap-2">
          <button class="rounded-full bg-slate-100 px-3 py-1 text-[11px] text-slate-600" onclick="useKeyword('雨伞')" type="button">雨伞</button>
          <button class="rounded-full bg-slate-100 px-3 py-1 text-[11px] text-slate-600" onclick="useKeyword('校园卡')" type="button">校园卡</button>
          <button class="rounded-full bg-slate-100 px-3 py-1 text-[11px] text-slate-600" onclick="useKeyword('图书馆')" type="button">图书馆</button>
          <button class="rounded-full bg-slate-100 px-3 py-1 text-[11px] text-slate-600" onclick="useKeyword('耳机')" type="button">耳机</button>
          <button class="rounded-full bg-slate-100 px-3 py-1 text-[11px] text-slate-600" onclick="useKeyword('钥匙')" type="button">钥匙</button>
        </div>
      </div>
    </header>
    <!-- 结果区 -->
    <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-6 pt-3">
      <!-- 类型筛选 -->
      <div class="flex items-center gap-2">
        <button class="rounded-full bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white" data-sfilter="all" onclick="filterType(this,'all')" type="button">全部类型</button>
        <button class="rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200" data-sfilter="lost" onclick="filterType(this,'lost')" type="button">寻物</button>
        <button class="rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200" data-sfilter="found" onclick="filterType(this,'found')" type="button">招领</button>
      </div>
      <div class="mt-3 flex items-center justify-between">
        <p class="text-[11px] text-slate-400" id="resultCount">共 6 条结果</p>
        <span class="is-hidden max-w-[180px] truncate text-[11px] text-blue-600" id="keywordTag"></span>
      </div>
      <!-- 结果列表（改造后由 render() 动态生成） -->
      <div class="mt-1 flex flex-col gap-3" id="resultList"></div>
      <!-- 无结果提示 -->
      <div class="is-hidden flex-col items-center justify-center px-6 py-16 text-center" id="emptyState">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-slate-100">
          <iconify-icon class="text-3xl text-slate-400" icon="mdi:magnify-close"></iconify-icon>
        </div>
        <h3 class="mt-4 text-[15px] font-semibold text-slate-700">没有找到相关信息</h3>
        <p class="mt-1 text-xs leading-relaxed text-slate-400">试试更换关键词，例如只输入物品名称或地点；也可以直接发布一条信息，让更多同学看到。</p>
        <div class="mt-5 flex items-center gap-3">
          <button class="rounded-xl bg-slate-100 px-4 py-2 text-xs font-medium text-slate-600" onclick="clearKeyword()" type="button">重新搜索</button>
          <a class="rounded-xl bg-blue-600 px-4 py-2 text-xs font-medium text-white" href="publish.html">去发布信息</a>
        </div>
      </div>
    </main>
    <!-- 底部导航 -->
    <nav class="shrink-0 border-t border-slate-200 bg-white px-2 pt-1.5 pb-2">
      <div class="grid grid-cols-4 gap-1">
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="index.html">
          <iconify-icon class="text-[22px]" icon="mdi:home-variant"></iconify-icon>
          <span class="text-[10px] font-medium">首页</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-blue-600" href="search.html">
          <iconify-icon class="text-[22px]" icon="mdi:magnify"></iconify-icon>
          <span class="text-[10px] font-medium">搜索</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="publish.html">
          <iconify-icon class="text-[22px]" icon="mdi:plus-circle-outline"></iconify-icon>
          <span class="text-[10px] font-medium">发布</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="my-posts.html">
          <iconify-icon class="text-[22px]" icon="mdi:clipboard-text-outline"></iconify-icon>
          <span class="text-[10px] font-medium">我的</span>
        </a>
      </div>
    </nav>
  </div>
  <!-- 数据层/种子/工具 -->
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/utils.js"></script>
  <script>
    var SFILTER_ON = 'rounded-full bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white';
    var SFILTER_OFF = 'rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200';
    var currentType = 'all';
    var currentKeyword = '';

    function typeBadge(type) {
      return type === 'lost'
        ? '<span class="rounded-md bg-orange-50 px-1.5 py-0.5 text-[10px] font-medium text-orange-600 ring-1 ring-orange-100">寻物</span>'
        : '<span class="rounded-md bg-emerald-50 px-1.5 py-0.5 text-[10px] font-medium text-emerald-600 ring-1 ring-emerald-100">招领</span>';
    }

    // 结果卡片模板：数据来自 store，不再是页面里写死的 ITEMS
    function cardHtml(item) {
      var tone = item.tone || 'from-slate-100 to-slate-200';
      var icon = item.icon || 'mdi:package-variant-closed';
      var iconColor = item.iconColor || 'text-slate-500/70';
      var alt = escapeHtml(item.alt || item.title);
      var done = item.status === '已找回' || item.status === '已归还';
      var tail = done
        ? '<span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500">' + escapeHtml(item.status) + '</span>'
        : '<span class="flex shrink-0 items-center text-[11px] font-medium text-blue-600">详情<iconify-icon icon="mdi:chevron-right" class="text-sm"></iconify-icon></span>';
      return '' +
        '<a href="detail.html?id=' + encodeURIComponent(item.id) + '" class="flex gap-3 rounded-2xl bg-white p-3 ring-1 ring-slate-100 shadow-sm">' +
        '<div class="relative h-[92px] w-[92px] shrink-0 overflow-hidden rounded-xl bg-gradient-to-br ' + tone + ' flex items-center justify-center">' +
        '<iconify-icon icon="' + icon + '" class="text-4xl ' + iconColor + '"></iconify-icon>' +
        '<img src="images/placeholder.svg" alt="' + alt + '" class="absolute inset-0 h-full w-full object-cover" onerror="this.style.display=\'none\'">' +
        '</div>' +
        '<div class="flex min-w-0 flex-1 flex-col justify-between py-0.5">' +
        '<div class="flex items-center gap-2">' + typeBadge(item.type) +
        '<span class="text-[11px] text-slate-400">' + escapeHtml(item.time || formatFullTime(item.fullTime)) + '</span></div>' +
        '<h3 class="mt-1 truncate text-[15px] font-semibold text-slate-800">' + escapeHtml(item.title) + '</h3>' +
        '<p class="mt-0.5 flex items-center gap-1 truncate text-xs text-slate-500">' +
        '<iconify-icon icon="mdi:map-marker-outline" class="text-sm text-slate-400"></iconify-icon>' + escapeHtml(item.place) +
        '</p>' +
        '<div class="mt-1 flex items-center justify-between">' +
        '<span class="truncate text-[11px] text-slate-400">点击查看完整描述</span>' +
        tail +
        '</div>' +
        '</div>' +
        '</a>';
    }

    function render() {
      initSeed(SEED_DATA);                        // 首次注入种子数据
      var kw = currentKeyword.trim();
      var list = search(kw, currentType);         // 关键词 + 类型过滤都交给数据层

      var box = document.getElementById('resultList');
      box.innerHTML = list.map(cardHtml).join('');

      var empty = document.getElementById('emptyState');
      if (list.length === 0) {
        box.classList.add('is-hidden');
        empty.classList.remove('is-hidden');
      } else {
        box.classList.remove('is-hidden');
        empty.classList.add('is-hidden');
      }

      document.getElementById('resultCount').textContent = kw === ''
        ? ('为你推荐 ' + list.length + ' 条信息')
        : ('共 ' + list.length + ' 条结果');

      var tag = document.getElementById('keywordTag');
      if (kw === '') {
        tag.classList.add('is-hidden');
        tag.textContent = '';
      } else {
        tag.classList.remove('is-hidden');
        tag.textContent = '关键词：' + kw;
      }

      var hot = document.getElementById('hotBlock');
      if (kw === '') {
        hot.classList.remove('is-hidden');
      } else {
        hot.classList.add('is-hidden');
      }
    }

    function filterType(btn, type) {
      currentType = type;
      var chips = document.querySelectorAll('[data-sfilter]');
      for (var i = 0; i < chips.length; i++) {
        chips[i].className = chips[i] === btn ? SFILTER_ON : SFILTER_OFF;
      }
      render();
    }

    function useKeyword(word) {
      document.getElementById('searchInput').value = word;
      currentKeyword = word;
      render();
    }

    function clearKeyword() {
      document.getElementById('searchInput').value = '';
      currentKeyword = '';
      render();
      document.getElementById('searchInput').focus();
    }

    function runSearch() {
      currentKeyword = document.getElementById('searchInput').value;
      render();
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      currentKeyword = this.value;
      render();
    });

    render();
  </script>
</body>

</html>
