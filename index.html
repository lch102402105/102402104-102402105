<!DOCTYPE html>

<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>校园失物招领 · 首页</title>
  <script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
  <script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>

<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center bg-slate-300 font-sans antialiased">
  <div class="relative w-full h-full max-w-[393px] max-h-[852px] bg-slate-50 flex flex-col overflow-hidden shadow-2xl">
    <!-- 顶部区域 -->
    <header class="shrink-0 bg-gradient-to-br from-blue-600 via-blue-600 to-indigo-600 px-5 pt-6 pb-6 rounded-b-[28px]">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-[11px] text-blue-100">2026 秋季学期 · 校园服务中心</p>
          <h1 class="mt-1 text-xl font-semibold text-white">失物招领</h1>
        </div>
        <div class="flex items-center gap-2">
          <a class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white" href="my-posts.html">
            <iconify-icon class="text-xl" icon="mdi:account-outline"></iconify-icon>
          </a>
          <button class="relative w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white" type="button">
            <iconify-icon class="text-xl" icon="mdi:bell-outline"></iconify-icon>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-amber-400"></span>
          </button>
        </div>
      </div>
      <a class="mt-4 flex items-center gap-2 rounded-xl bg-white px-3.5 py-2.5 shadow-sm" href="search.html">
        <iconify-icon class="text-lg text-slate-400" icon="mdi:magnify"></iconify-icon>
        <span class="text-[13px] text-slate-400">搜索物品名称、地点，如“雨伞 图书馆”</span>
      </a>
      <div class="mt-3 flex items-center gap-4 text-[11px] text-blue-50">
        <span class="flex items-center gap-1">
          <iconify-icon class="text-[7px] text-amber-300" icon="mdi:circle"></iconify-icon>今日新增 12 条
        </span>
        <span class="flex items-center gap-1">
          <iconify-icon class="text-[7px] text-emerald-300" icon="mdi:circle"></iconify-icon>待认领 38 条
        </span>
      </div>
    </header>
    <!-- 主内容 -->
    <main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pb-6">
      <!-- 分类标签 -->
      <div class="sticky top-0 z-20 -mx-4 bg-slate-50/95 px-4 pt-3 pb-2 backdrop-blur">
        <div class="flex items-center gap-2">
          <button class="flex items-center gap-1 rounded-full bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white shadow-sm" data-chip="all" onclick="filterCards(this,'all')" type="button">
            全部
          </button>
          <button class="flex items-center gap-1 rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200" data-chip="lost" onclick="filterCards(this,'lost')" type="button">
            寻物
          </button>
          <button class="flex items-center gap-1 rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200" data-chip="found" onclick="filterCards(this,'found')" type="button">
            招领
          </button>
          <span class="ml-auto text-[11px] text-slate-400" id="countText">共 6 条信息</span>
        </div>
      </div>
      <!-- 信息卡片列表（改造后由 renderCards() 动态生成） -->
      <div class="mt-1 flex flex-col gap-3" id="cardList"></div>
      <!-- 空状态 -->
      <div class="is-hidden flex-col items-center justify-center px-6 py-16 text-center" id="emptyState">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-slate-100">
          <iconify-icon class="text-3xl text-slate-400" icon="mdi:inbox-outline"></iconify-icon>
        </div>
        <h3 class="mt-4 text-[15px] font-semibold text-slate-700" id="emptyTitle">这里还没有信息</h3>
        <p class="mt-1 text-xs leading-relaxed text-slate-400" id="emptyDesc">切换到其他分类看看，或者发布一条新的寻物 / 招领信息。</p>
        <a class="mt-5 rounded-xl bg-blue-600 px-5 py-2 text-xs font-medium text-white" href="publish.html">去发布信息</a>
      </div>
      <p class="mt-5 text-center text-[11px] leading-relaxed text-slate-400">
        信息由同学自主发布，请在公共场所当面交接物品<br />校园服务中心 · 二食堂一楼东侧
      </p>
    </main>
    <!-- 底部导航 -->
    <nav class="shrink-0 border-t border-slate-200 bg-white px-2 pt-1.5 pb-2">
      <div class="grid grid-cols-4 gap-1">
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-blue-600" href="index.html">
          <iconify-icon class="text-[22px]" icon="mdi:home-variant"></iconify-icon>
          <span class="text-[10px] font-medium">首页</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="search.html">
          <iconify-icon class="text-[22px]" icon="mdi:magnify"></iconify-icon>
          <span class="text-[10px] font-medium">搜索</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="publish.html">
          <iconify-icon class="text-[22px]" icon="mdi:plus-circle-outline"></iconify-icon>
          <span class="text-[10px] font-medium">发布</span>
        </a>
        <a class="flex flex-col items-center gap-0.5 rounded-xl py-1.5 text-slate-400" href="my-posts.html">
          <iconify-icon class="text-[22px]" icon="mdi:clipboard-text-outline"></iconify-icon>
          <span class="text-[10px] font-medium">我的</span>
        </a>
      </div>
    </nav>
  </div>
  <!-- 数据层/种子/工具 -->
  <script src="js/store.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/utils.js"></script>
  <script>
    var CHIP_ON = 'flex items-center gap-1 rounded-full bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white shadow-sm';
    var CHIP_OFF = 'flex items-center gap-1 rounded-full bg-white px-3.5 py-1.5 text-xs font-medium text-slate-600 ring-1 ring-slate-200';
    var currentFilter = 'all';

    // 类型 / 状态标签
    function typeBadge(type) {
      return type === 'lost'
        ? '<span class="rounded-md bg-orange-50 px-1.5 py-0.5 text-[10px] font-medium text-orange-600 ring-1 ring-orange-100">寻物</span>'
        : '<span class="rounded-md bg-emerald-50 px-1.5 py-0.5 text-[10px] font-medium text-emerald-600 ring-1 ring-emerald-100">招领</span>';
    }

    function statusBadge(status) {
      var done = status === '已找回' || status === '已归还';
      return done
        ? '<span class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px] font-medium text-slate-500">' + escapeHtml(status) + '</span>'
        : '<span class="flex shrink-0 items-center text-[11px] font-medium text-blue-600">详情<iconify-icon class="text-sm" icon="mdi:chevron-right"></iconify-icon></span>';
    }

    // 单张卡片模板（原来写死的 6 个 <a class="card-item"> 收在这里）
    function cardTemplate(it) {
      var tone = it.tone || 'from-slate-100 to-slate-200';
      var icon = it.icon || 'mdi:package-variant-closed';
      var iconColor = it.iconColor || 'text-slate-500/70';
      var alt = escapeHtml(it.alt || it.title);
      var note = (it.publisher || '匿名同学') + (it.meta ? ' · ' + it.meta : '');
      return '' +
        '<a class="card-item flex gap-3 rounded-2xl bg-white p-3 ring-1 ring-slate-100 shadow-sm" data-type="' + it.type + '" data-id="' + it.id + '" href="detail.html?id=' + encodeURIComponent(it.id) + '">' +
        '<div class="relative w-[92px] h-[92px] shrink-0 overflow-hidden rounded-xl bg-gradient-to-br ' + tone + ' flex items-center justify-center">' +
        '<iconify-icon class="text-4xl ' + iconColor + '" icon="' + icon + '"></iconify-icon>' +
        '<img alt="' + alt + '" class="absolute inset-0 w-full h-full object-cover" src="images/placeholder.svg" onerror="this.style.display=\'none\'" />' +
        '</div>' +
        '<div class="flex min-w-0 flex-1 flex-col justify-between py-0.5">' +
        '<div class="flex items-center gap-2">' + typeBadge(it.type) +
        '<span class="text-[11px] text-slate-400">' + escapeHtml(it.time || formatFullTime(it.fullTime)) + '</span></div>' +
        '<h3 class="mt-1 truncate text-[15px] font-semibold text-slate-800">' + escapeHtml(it.title) + '</h3>' +
        '<p class="mt-0.5 flex items-center gap-1 truncate text-xs text-slate-500">' +
        '<iconify-icon class="text-sm text-slate-400" icon="mdi:map-marker-outline"></iconify-icon>' + escapeHtml(it.place) + '</p>' +
        '<div class="mt-1 flex items-center justify-between">' +
        '<span class="truncate text-[11px] text-slate-400">' + escapeHtml(note) + '</span>' +
        statusBadge(it.status) +
        '</div>' +
        '</div>' +
        '</a>';
    }

    // 原来写死的卡片列表改成动态生成，数据全部来自 store
    function renderCards() {
      initSeed(SEED_DATA);                             // 首次注入种子数据
      var list = search('', currentFilter);            // 首页不带关键词

      var box = document.getElementById('cardList');
      box.innerHTML = list.map(cardTemplate).join('');

      document.getElementById('countText').textContent = '共 ' + list.length + ' 条信息';

      var empty = document.getElementById('emptyState');
      if (list.length === 0) {
        box.classList.add('is-hidden');
        empty.classList.remove('is-hidden');
        document.getElementById('emptyTitle').textContent = '这里还没有信息';
        document.getElementById('emptyDesc').textContent = currentFilter === 'all'
          ? '还没有人发布信息，去发布第一条吧。'
          : '这个分类下暂时没有信息，切换其他分类看看。';
      } else {
        box.classList.remove('is-hidden');
        empty.classList.add('is-hidden');
      }
    }

    function filterCards(btn, type) {
      currentFilter = type;
      var chips = document.querySelectorAll('[data-chip]');
      for (var i = 0; i < chips.length; i++) {
        chips[i].className = chips[i] === btn ? CHIP_ON : CHIP_OFF;
      }
      renderCards();
    }

    renderCards();
  </script>
</body>

</html>
